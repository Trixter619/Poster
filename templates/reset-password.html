<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Новый пароль · VK Poster</title><link rel="stylesheet" href="/static/style.css"><script src="/static/reset-password.js" defer></script></head><body class="auth-body"><main class="auth-card"><h1>Восстановление пароля</h1>{% if completed %}<p role="status">Пароль изменён. Прежние сеансы завершены.</p><a class="primary" href="/login">Войти с новым паролем</a>{% else %}<p>Ссылка действует 30 минут и используется один раз. Новый пароль должен содержать не менее 12 символов.</p>{% if error %}<p role="alert" class="auth-error">{{ error }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="token" id="resetToken" value="{{ token or '' }}"><label>Новый пароль<input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><label>Повтори новый пароль<input type="password" name="password_confirm" required minlength="12" maxlength="256" autocomplete="new-password"></label><button>Сохранить новый пароль</button></form>{% endif %}<p><a href="/forgot-password">Запросить новую ссылку</a></p></main></body></html>
