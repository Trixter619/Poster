<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Заявка на доступ · VK Poster</title><link rel="stylesheet" href="/static/style.css"></head><body class="auth-body"><main class="auth-card"><a href="/login">← Вход</a><h1>Запросить доступ</h1><p>Придумай логин и пароль. Доступ к объявлениям и своему аккаунту VK появится после одобрения администратором.</p>{% if error %}<p role="alert" class="auth-error">{{ error }}</p>{% endif %}{% if message %}<p role="status">{{ message }}</p>{% else %}<form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Логин<input name="username" required minlength="3" maxlength="40" autocomplete="username"></label><label>Пароль<input type="password" name="password" required minlength="12" maxlength="256" autocomplete="new-password"></label><button>Отправить заявку</button></form>{% endif %}</main></body></html>
